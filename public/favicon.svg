<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="yay-sys-tray update checker">
  <defs>
    <!-- SKINT007 violet tile -->
    <linearGradient id="tile" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#5b21b6"/>
    </linearGradient>
    <!-- top-edge sheen -->
    <linearGradient id="sheen" x1="256" y1="0" x2="256" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="0.4" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <!-- brand bloom behind the glyph -->
    <radialGradient id="bloom" cx="256" cy="248" r="200" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- tile -->
  <rect x="0" y="0" width="512" height="512" rx="116" fill="url(#tile)"/>
  <rect x="0" y="0" width="512" height="512" rx="116" fill="url(#bloom)"/>
  <rect x="0" y="0" width="512" height="512" rx="116" fill="url(#sheen)"/>
  <rect x="4" y="4" width="504" height="504" rx="112" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="2"/>

  <!-- two-tone refresh ring: updates available -->
  <g fill="none" stroke-width="40" stroke-linecap="round">
    <!-- upper arc -->
    <path d="M 193 146.9 A 130 130 0 0 1 365.1 321" stroke="#f4f2fb"/>
    <!-- lower arc -->
    <path d="M 321 368.6 A 130 130 0 0 1 143.4 191" stroke="#22d3ee"/>
  </g>
  <!-- arrowheads (leading, clockwise) -->
  <path d="M 342.1 360.8 L 394.5 304 L 335.7 338 Z" fill="#f4f2fb"/>
  <path d="M 166.4 151.2 L 114 174 L 172.8 208 Z" fill="#22d3ee"/>
</svg>
