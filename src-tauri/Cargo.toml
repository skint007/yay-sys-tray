[package]
name = "yay-sys-tray"
version = "1.6.6"
description = "Arch Linux system tray update checker"
authors = ["skint007"]
license = "MIT"
repository = "https://github.com/skint007/yay-sys-tray"
edition = "2021"
rust-version = "1.88"

[lib]
name = "yay_sys_tray_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-notification = "2"
tauri-plugin-shell = "2"
tauri-plugin-log = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "time", "sync", "fs", "macros"] }
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
which = "7"
log = "0.4"
resvg = "0.45"
# rustls rather than the default native-TLS so AUR checks don't depend on the
# system OpenSSL version being ABI-compatible with whatever this was built on.
# Note this pulls webpki-roots, so the AUR check trusts a compiled-in root set
# rather than the system store: behind a TLS-inspecting proxy with a locally
# installed CA, the check fails with a cert error that reads as an AUR outage.
reqwest = { version = "0.12", default-features = false, features = [
  "json",
  "rustls-tls",
  "gzip",
] }

[target.'cfg(target_os = "linux")'.dependencies]
# Tauri's libappindicator backend cannot distinguish left and right clicks on
# Linux. ksni speaks the StatusNotifierItem protocol directly, which exposes
# left-click activation separately from the context-menu request.
ksni = "0.2.2"
libloading = "0.7"
libc = "0.2"
